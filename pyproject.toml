[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "task-authority-lab"
version = "0.1.0"
description = "Prospective shadow Task Authority Decision research harness"
requires-python = ">=3.11"

[project.scripts]
tad-lab = "task_authority_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["task_authority_lab*"]
